name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: recall-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the real floor: lib/recall_format.py uses PEP 604 `str | None`
        # in annotations evaluated at definition time. 3.13 catches drift on the
        # version most contributors are actually running.
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # PyYAML is the only third-party runtime import (lib/sync_config.py).
        # scikit-learn is deliberately absent: lib/text_rank.py treats it as
        # optional and falls back, and CI should exercise the path a plugin
        # install without ML dependencies actually takes.
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Verify the test catalogue matches the suite
        # Run first and on its own: a drifted map should be an obvious,
        # standalone failure rather than one line inside 900 dots.
        run: python -m pytest tests/test_catalogue.py -q

      - name: Run the full suite
        run: python -m pytest tests/ -q

      - name: Verify every surface tag selects tests
        # Each 'How to run' cell in the catalogue is a promise; an empty
        # selection means the promise is broken even when the suite is green.
        run: |
          set -euo pipefail
          for surface in capture recall restart knowledge memory sync platform; do
            count=$(python -m pytest tests/ -m "$surface" --collect-only -q 2>/dev/null \
              | grep -cE '::' || true)
            if [ "$count" -eq 0 ]; then
              echo "::error::pytest -m $surface selected no tests"
              exit 1
            fi
            echo "  -m $surface -> $count tests"
          done

  parity:
    name: Rust/Python parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the Rust fast path
        run: cargo build --release

      - name: Run parity tests
        # These skip themselves when the binary is missing, so a green run
        # proves nothing unless we also assert they actually executed.
        run: |
          set -euo pipefail
          python -m pytest tests/test_rust_python_parity.py -q -rs | tee parity.log
          if grep -qi 'skipped' parity.log; then
            echo "::error::parity tests skipped — the Rust binary did not build or was not found"
            exit 1
          fi
